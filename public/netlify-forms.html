<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- Netlify form declaration — required for Next.js so Netlify detects the form at build time -->
<form name="contact" netlify data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="company" />
  <select name="budget"><option value=""></option></select>
  <textarea name="message"></textarea>
</form>
</body>
</html>
